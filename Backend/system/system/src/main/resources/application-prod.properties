# ==========================================================
# PROD CONFIG — Render + Supabase + Brevo SMTP
# 
# Set these environment variables on Render dashboard:
#   SUPABASE_DB_URL      = jdbc:postgresql://...
#   SUPABASE_DB_USERNAME = postgres
#   SUPABASE_DB_PASSWORD = your-supabase-password
#
# For email on prod, either:
#   A) Use Gmail (same account, no extra setup):
#      MAIL_HOST     = smtp.gmail.com
#      MAIL_USERNAME = system.water.tank@gmail.com
#      MAIL_PASSWORD = xcnubvwuobbkklyd
#      MAIL_FROM     = system.water.tank@gmail.com
#   B) Use Brevo SMTP (recommended for prod volume):
#      MAIL_HOST     = smtp-relay.brevo.com
#      MAIL_USERNAME = your-brevo-login-email
#      MAIL_PASSWORD = your-brevo-smtp-key
#      MAIL_FROM     = system.water.tank@gmail.com
# ==========================================================

# Supabase PostgreSQL connection (via environment variables)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# SMTP — defaults to Gmail if no MAIL_HOST env var is set
# Override with Brevo vars on Render if you prefer
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:system.water.tank@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xcnubvwuobbkklyd}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.properties.mail.from=${MAIL_FROM:system.water.tank@gmail.com}

# Admin login
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:tank@admin2026}
