# ==========================================================
# MAIN CONFIG — auto-detects profile
# Local (IntelliJ) → "local" profile → H2
# Render (online)  → "prod" profile  → Supabase PostgreSQL
# ==========================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.application.name=tank-system
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Gmail SMTP ──
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:system.water.tank@gmail.com}
spring.mail.password=${MAIL_PASSWORD:qhkiqlklmlbhfycf}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.from=system.water.tank@gmail.com
